name: Emulator smoke test (temporary)
on:
  push:
    branches: ['debug/**']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch, switch theme, measure bar colours
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.harmonylab.app/.MainActivity
            sleep 25
            adb exec-out screencap -p > dark.png
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml ui.xml || true
            python3 -c "import re;x=open('ui.xml',encoding='utf-8',errors='ignore').read() if __import__('os').path.exists('ui.xml') else '';m=re.search(r'(?:content-desc|text)=\"Appearance[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"',x);print('%d %d'%(((int(m[1])+int(m[3]))//2),((int(m[2])+int(m[4]))//2)) if m else 'none')" > tap.txt
            cat tap.txt
            adb shell input tap 237 60; sleep 4
            adb exec-out screencap -p > light.png
            adb shell input tap 237 60; sleep 4
            adb exec-out screencap -p > third.png
            adb logcat -d -b crash > crash.txt || true
            (adb shell pidof com.harmonylab.app >/dev/null && echo RUNNING || echo NOT_RUNNING) > state.txt
      - name: Report as annotation
        if: always()
        run: |
          pip install pillow >/dev/null 2>&1 || true
          python3 - <<'PY' > report.txt
          import os
          print('API ${{ matrix.api }} STATE:', open('state.txt').read().strip() if os.path.exists('state.txt') else 'unknown')
          print('theme tap at:', open('tap.txt').read().strip() if os.path.exists('tap.txt') else 'n/a')
          try:
              from PIL import Image
              for n in ['dark.png','light.png','third.png']:
                  if os.path.exists(n):
                      im=Image.open(n).convert('RGB');w,h=im.size
                      print(n, im.size, 'status bar px', im.getpixel((w//2,10)), '| page top', im.getpixel((w//2,int(h*0.12))), '| nav bar px', im.getpixel((w//2,h-8)))
          except Exception as e: print('pixel check failed', e)
          print('--- crash buffer'); print(open('crash.txt').read()[:15000] if os.path.exists('crash.txt') else '')
          PY
          body=$(python3 -c "t=open('report.txt',encoding='utf-8',errors='replace').read()[:60000];print(t.replace('%','%25').replace('\r','').replace('\n','%0A'))")
          echo "::error title=api-${{ matrix.api }}::$body"
